{% extends "base.html" %}

{% block title %}支付成功 | 校园二手书交易系统{% endblock %}

{% block content %}
<div class="container py-4 py-lg-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6 col-xl-5">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body p-4 p-lg-5">
                    <div class="success-icon mx-auto mb-3">✓</div>
                    <span class="badge text-bg-light border mb-3">模拟支付已完成</span>
                    <h1 class="h4 mb-1">支付成功！</h1>
                    <p class="text-secondary small mb-4">本页面仅用于课程项目模拟，不会发生真实扣款</p>

                    <dl class="row text-start g-2 payment-summary mb-4">
                        <dt class="col-5">订单编号</dt>
                        <dd class="col-7">{{ order.order_id }}</dd>
                        <dt class="col-5">商品</dt>
                        <dd class="col-7">{{ order.listing.book.title }}</dd>
                        <dt class="col-5">支付金额</dt>
                        <dd class="col-7">¥{{ order.total_amount|floatformat:2 }}</dd>
                    </dl>

                    <div class="d-grid gap-2">
                        <a class="btn btn-primary" href="{% url 'trade:order_detail' order.order_id %}">
                            查看订单
                        </a>
                        <a class="btn btn-outline-secondary" href="{% url 'catalog:listing_list' %}">
                            返回商品列表
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
